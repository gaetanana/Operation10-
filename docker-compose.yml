services:
  postgres:
    image: postgres:16-alpine
    container_name: operation10-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-operation10}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-operation10_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - operation10-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: operation10-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${DB_USER:-operation10}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-operation10_db}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      NODE_ENV: development
      PORT: 3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - operation10-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: operation10-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - operation10-network

volumes:
  postgres_data:

networks:
  operation10-network:
    driver: bridge
